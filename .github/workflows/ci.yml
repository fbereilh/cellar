name: CI

# Build + type-check + unit tests on every PR into main and every push to main.
# The app needs `uv` + Python only at RUNTIME (to boot the kernel); building and
# type-checking are pure Node, so this job installs Node alone and stays fast
# (~2m38s). The end-to-end suite gates every PR as well, from its own sharded
# workflow — see .github/workflows/e2e.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when a new commit lands on the same ref
# (e.g. a force-push to a PR branch), so only the latest run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Single Node version for now (a matrix can be added here later if we
      # ever need to support multiple). Pinned to current LTS.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check

      # Unit tests (vitest) — pure Node, no browser, no kernel, and the fast half
      # of the gate. The Playwright E2E runs on every PR too, but in its own
      # workflow (.github/workflows/e2e.yml): it needs the kernel runtime
      # (uv + python3 + cellar's host-venv) and is sharded across runners, so it
      # would otherwise hold this ~2m38s check open for its own duration. Keeping
      # them separate is what lets a type error surface in seconds while the e2e
      # shards are still booting.
      - name: Unit tests
        run: npm run test

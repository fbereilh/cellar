<!-- Sized for legibility at 16x16: wide bowl, thick stem and base, full-bleed tile (no 1px inset,
     rx 7) so the glass runs wider. The previous slimmer glass lost its stem and base to antialiasing
     at that size, so verify any geometry change against a real 16px raster, not by eyeballing it large. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cellar">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c792e9"/>
      <stop offset="1" stop-color="#9050b4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <g fill="#f7f3fa">
    <!-- bowl -->
    <path d="M4.6 4.4h22.8L17.7 19.4h-3.4Z"/>
    <!-- stem -->
    <rect x="14.2" y="18.4" width="3.6" height="6.6" rx="0.6"/>
    <!-- base -->
    <rect x="7.4" y="24.4" width="17.2" height="3.4" rx="1.7"/>
  </g>
</svg>

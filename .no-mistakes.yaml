# Per-repo no-mistakes overrides.
#
# no-mistakes reads `commands` from the DEFAULT branch, never from the pushed
# branch (a security gate against a PR injecting shell). A change to `commands`
# here therefore takes effect only for runs that start after it merges to main.

commands:
  # Install dependencies into the pipeline's own run worktree before any
  # configured command. Every run gets a fresh `git worktree` holding TRACKED
  # files only, so the gitignored `node_modules` is absent there. Without this
  # line `npm test` died with exit 127 (`sh: vitest: command not found`) on
  # every run, so the suite never ran and the Test step was approved over its
  # failure instead. A failing prepare FAILS the Test step outright, before
  # the test command and before any approval gate, so a broken install is a
  # visible red rather than a skippable one. `npm ci` installs exactly the
  # lockfile and refuses when it disagrees with package.json; `--prefer-offline`
  # takes packages from the local npm cache when it already holds them.
  prepare: 'npm ci --prefer-offline'
  # The real vitest unit suite (`vitest run`, non-watch), as the Test step's
  # deterministic baseline. vitest exits non-zero when it finds no test file,
  # so an empty run cannot read as a pass either.
  test: 'npm test'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
